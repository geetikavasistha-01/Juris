name: Juris CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Lint, Test, Guard, and Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Gitleaks secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Run Secretlint local scanner
        run: pnpm run scan:secrets

      - name: Typecheck workspace
        run: pnpm run typecheck

      - name: Lint workspace
        run: pnpm run lint

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Start local Supabase stack
        run: supabase start

      - name: Run unit & contract tests
        run: pnpm run test

      - name: Verify requirements-to-tests traceability
        run: pnpm run check:requirements

      - name: Verify forbidden words in product code
        run: pnpm run check:forbidden

      - name: Verify design token contracts & contrast
        run: |
          pnpm run check:tokens
          pnpm run check:contrast

      - name: Build all workspace packages
        run: pnpm run build

      - name: Verify zero external host dependencies in dist
        run: pnpm run check:external-hosts

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run Playwright smoke test
        run: pnpm --filter=@juris/e2e test
