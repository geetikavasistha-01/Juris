<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Civic Visualizations Benchmark (Spike S5)</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        margin: 0;
        padding: 24px;
        background: #0b1329;
        color: #f8fafc;
      }
      header {
        margin-bottom: 24px;
      }
      h1 {
        font-size: 24px;
        margin: 0 0 8px 0;
        color: #38bdf8;
      }
      .subtitle {
        color: #94a3b8;
        font-size: 14px;
      }

      /* Key figures strip */
      .kpi-strip {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 16px;
        margin-bottom: 24px;
      }
      .kpi-card {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 16px;
        display: flex;
        flex-direction: column;
        gap: 6px;
      }
      .kpi-card .label {
        font-size: 12px;
        color: #94a3b8;
        text-transform: uppercase;
        font-weight: 600;
      }
      .kpi-card .value {
        font-size: 22px;
        font-weight: 700;
        color: #f8fafc;
      }
      .kpi-card .badge {
        display: inline-block;
        font-size: 11px;
        padding: 2px 6px;
        border-radius: 4px;
        background: #0f766e;
        color: #ccfbf1;
        width: fit-content;
      }
      .kpi-card .badge.highlight {
        background: #0284c7;
        color: #e0f2fe;
      }

      #selected-detail {
        margin-bottom: 20px;
      }
      .selection-box {
        background: #0369a1;
        padding: 12px 16px;
        border-radius: 6px;
        font-size: 14px;
      }

      /* Chart grid */
      .charts-grid {
        display: grid;
        grid-template-columns: repeat(2, 1fr);
        gap: 20px;
      }
      .chart-container {
        background: #1e293b;
        border: 1px solid #334155;
        border-radius: 8px;
        padding: 16px;
        height: 350px;
      }
      @media (max-width: 900px) {
        .charts-grid {
          grid-template-columns: 1fr;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Juris Civic Visualizations (Spike S5)</h1>
      <div class="subtitle">
        ECharts Tree-shaking & Cross-filtering Evaluation with Real Budget Data
      </div>
    </header>

    <!-- 1. Key Figures Strip (Rendered synchronously without chart library) -->
    <div id="key-figures-strip" class="kpi-strip"></div>

    <!-- Selection drawer for cross-filtering -->
    <div id="selected-detail"></div>

    <!-- 2. Charts Grid (Rendered via lazy-loaded ECharts chunk) -->
    <div class="charts-grid">
      <div id="chart-treemap" class="chart-container"></div>
      <div id="chart-bar" class="chart-container"></div>
      <div id="chart-line" class="chart-container"></div>
      <div id="chart-sunburst" class="chart-container"></div>
      <div id="chart-heatmap" class="chart-container" style="grid-column: span 2"></div>
    </div>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
